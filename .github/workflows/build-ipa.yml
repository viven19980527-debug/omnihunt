name: build-ipa

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OmniHunt unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          PBX=OmniHunt.xcodeproj/project.pbxproj
          echo "--- objectVersion before ---"
          grep -m1 objectVersion "$PBX" || true
          # XcodeGen 2.46 会写 objectVersion 77（Xcode16 格式）；
          # 若 runner 的 Xcode 较旧，降到 56 才能打开
          if grep -q "objectVersion = 77;" "$PBX"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PBX"
            echo "downgraded to 56"
          fi
          grep -m1 objectVersion "$PBX" || true
          ls -la

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OmniHunt.xcodeproj \
            -scheme OmniHunt \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          echo "----- errors -----"
          grep -nE "error:" build.log | head -40 || echo "(no error)"

      - name: Package IPA
        working-directory: ios
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OmniHunt-unsigned.ipa Payload
          ls -lh OmniHunt-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniHunt-unsigned-ipa
          path: ios/OmniHunt-unsigned.ipa
          if-no-files-found: error
