name: OmniHunt
options:
  bundleIdPrefix: dev.omnihunt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OmniHunt:
    type: application
    platform: iOS
    sources:
      - path: OmniHunt
        excludes:
          - "Info.plist"
    info:
      path: OmniHunt/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.omnihunt.app
        PRODUCT_NAME: OmniHunt
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
