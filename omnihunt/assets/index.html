<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniHunt · 万能聚合搜索</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="clearnet · onion · catalog · magnet 多源聚合搜索">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OmniHunt">
<link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<style>
  :root{
    --bg:#0a0c10; --panel:#11151c; --panel-2:#161b24; --line:#232b38;
    --ink:#e8edf5; --muted:#8b97a8; --dim:#5c6675;
    --accent:#5ef2b0; --accent-2:#39c98d; --warn:#ffb86b; --bad:#ff6b81;
    --web:#5cc8ff; --onion:#c48bff; --adult:#ff85c0; --torrent:#ffcc66; --pattern:#8b97a8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #12261f 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 0%, #1a1426 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font:15px/1.55 "Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{
    max-width:1040px;margin:0 auto;
    padding:calc(34px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));
  }
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .mark{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    background:conic-gradient(from 120deg,var(--accent),#4ea8ff,var(--onion),var(--accent));
    box-shadow:0 0 24px rgba(94,242,176,.25);
    position:relative;
  }
  .mark::after{content:"";position:absolute;inset:9px;border-radius:6px;background:var(--bg)}
  .brand{font-weight:700;letter-spacing:.12em;font-size:15px}
  .brand small{display:block;font-weight:400;letter-spacing:.02em;color:var(--muted);font-size:11.5px}
  .spacer{flex:1}
  .ghost{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:7px 11px;border-radius:9px;font-size:12px;cursor:pointer;
  }
  .ghost:hover{color:var(--ink);border-color:#33405430}
  form.search{
    display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:10px 10px 10px 16px;align-items:center;
    box-shadow:0 10px 40px -24px #000;
  }
  form.search:focus-within{border-color:#2f4a3f;box-shadow:0 0 0 3px rgba(94,242,176,.08)}
  form.search input{
    flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--ink);
    font-size:16px;font-family:inherit;
  }
  form.search input::placeholder{color:var(--dim)}
  .kbd{border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--dim);font-size:11px}
  button.go{
    border:0;border-radius:10px;padding:10px 18px;font-weight:650;cursor:pointer;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#04150f;
  }
  button.go:active{transform:translateY(1px)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px}
  .chip{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;user-select:none;
  }
  .chip[aria-pressed="true"]{color:#08110d;background:var(--accent);border-color:var(--accent);font-weight:650}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;cursor:pointer;margin-left:auto}
  .toggle input{accent-color:var(--accent)}
  .meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--dim);font-size:12px;margin:16px 2px 6px}
  .meta b{color:var(--muted);font-weight:600}
  .errors{margin:10px 0 0;border:1px solid #3a2a1c;background:#1b1410;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--warn)}
  .errors summary{cursor:pointer}
  .hits{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .hit{
    background:linear-gradient(180deg,var(--panel),#0f131a);
    border:1px solid var(--line);border-radius:13px;padding:13px 15px;
    transition:border-color .15s, transform .15s;
    overflow:hidden;
  }
  .hit:hover{border-color:#31404f;transform:translateY(-1px)}
  .hit-top{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .badge{
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;border:1px solid currentColor;opacity:.9;flex:0 0 auto;
  }
  .badge.web{color:var(--web)} .badge.onion{color:var(--onion)}
  .badge.adult{color:var(--adult)} .badge.torrent{color:var(--torrent)}
  .badge.pattern{color:var(--pattern)}
  .hit-title{font-weight:600;font-size:15.5px;line-height:1.35;color:#eef4ff}
  .hit-title:hover{color:var(--accent)}
  .hit-url{
    color:#6f8ba8;font-size:12.5px;margin-top:4px;word-break:break-all;
    font-family:"SFMono-Regular",Consolas,monospace;
  }
  .hit-snip{color:#a9b5c6;font-size:13.5px;margin:6px 0 0}
  .hit-foot{display:flex;flex-wrap:wrap;row-gap:6px;gap:10px;align-items:center;margin-top:9px;color:var(--dim);font-size:11.5px}
  .hit-foot .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .hit-foot button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:7px;padding:2px 8px;font-size:11px;cursor:pointer;
  }
  .hit-foot button:hover{color:var(--ink)}
  .empty{
    border:1px dashed var(--line);border-radius:14px;padding:34px 24px;text-align:center;color:var(--muted);
    margin-top:18px;
  }
  .empty h3{margin:0 0 6px;color:var(--ink);font-size:15px}
  .examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .examples button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;
  }
  .examples button:hover{color:var(--ink);border-color:#33404f}
  .skeleton{height:74px;border-radius:13px;border:1px solid var(--line);
    background:linear-gradient(90deg,#0f131a,#161c26,#0f131a);background-size:200% 100%;
    animation:sh 1.1s linear infinite;margin-bottom:10px}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  footer{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;color:var(--dim);font-size:12px}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--muted)}
  .pill.off{opacity:.45;text-decoration:line-through}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
    background:#0f1a15;border:1px solid #2c4a3c;color:var(--accent);
    padding:9px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:all .2s;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){
    .wrap{padding:calc(22px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
    .kbd{display:none}
    button.go{padding:10px 14px}
    .toggle{margin-left:0}
    .hit-foot .src{max-width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"></div>
    <div class="brand">OMNIHUNT<small>clearnet · onion · catalog · magnet</small></div>
    <div class="spacer"></div>
    <button class="ghost" id="btn-json" title="导出当前结果 JSON">导出 JSON</button>
  </header>

  <form class="search" id="form" autocomplete="off">
    <input id="q" name="q" placeholder="搜任意关键词：番号、标签、站点、infohash…" aria-label="搜索关键词">
    <span class="kbd">Ctrl K</span>
    <button class="go" type="submit">搜索</button>
  </form>

  <div class="controls" id="chips">
    <button class="chip" data-kind="" aria-pressed="true">全部</button>
    <button class="chip" data-kind="web" aria-pressed="false">网页</button>
    <button class="chip" data-kind="onion" aria-pressed="false">暗网</button>
    <button class="chip" data-kind="adult" aria-pressed="false">成人</button>
    <button class="chip" data-kind="torrent" aria-pressed="false">磁力</button>
    <button class="chip" data-kind="pattern" aria-pressed="false">查询模式</button>
    <label class="toggle"><input type="checkbox" id="patterns"> 深度模式（附加操作符）</label>
  </div>

  <div class="meta" id="meta"></div>
  <div id="errors"></div>
  <div class="hits" id="hits"></div>

  <div class="empty" id="empty">
    <h3 id="empty-title">输入关键词开始</h3>
    <div id="empty-desc">一个查询同时打 clearnet 引擎、.onion 索引、成人站目录与磁力索引，按 URL 去重后统一排序。</div>
    <div class="examples" id="examples"></div>
  </div>

  <footer>
    <div>OmniHunt · 本地聚合器。结果来自各自站点，链接直接跳转原站。</div>
    <div class="pills" id="pills"></div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const form = $("#form"), input = $("#q"), hits = $("#hits"), meta = $("#meta"),
        empty = $("#empty"), errBox = $("#errors"), toast = $("#toast"),
        pills = $("#pills"), chips = $("#chips"), patternsBox = $("#patterns");

  const KIND_LABEL = {web:"web", onion:"onion", adult:"adult", torrent:"torrent", pattern:"pattern"};
  let state = {kind: localStorage.getItem("omni.kind") || "", data: null};
  let controller = null;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtMs = (ms) => ms >= 1000 ? (ms/1000).toFixed(2) + " s" : ms + " ms";

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("on"), 1400);
  }

  async function copy(text){
    try { await navigator.clipboard.writeText(text); showToast("已复制"); }
    catch { showToast("复制失败，手动选择"); }
  }

  function syncChips(){
    [...chips.querySelectorAll(".chip")].forEach((c) =>
      c.setAttribute("aria-pressed", String(c.dataset.kind === state.kind)));
  }

  function render(data){
    state.data = data;
    const rs = data.results || [];
    meta.innerHTML = `<span>结果 <b>${data.count}</b></span>
      <span>耗时 <b>${fmtMs(data.took_ms)}</b></span>
      <span>引擎 <b>${(data.stats?.engines || []).length}</b></span>
      ${data.cached ? "<span>缓存命中</span>" : ""}
      <span>去重前 <b>${data.stats?.raw ?? "-"}</b></span>`;

    errBox.innerHTML = "";
    if (data.errors && data.errors.length){
      const det = document.createElement("details");
      det.className = "errors";
      det.innerHTML = `<summary>${data.errors.length} 个引擎失败（点开看原因）</summary>` +
        data.errors.map((e) => `<div>· <b>${esc(e.engine)}</b> — ${esc(e.message).slice(0, 220)}</div>`).join("");
      errBox.appendChild(det);
    }

    hits.innerHTML = "";
    empty.style.display = rs.length ? "none" : "block";
    if (!rs.length){
      const title = $("#empty-title"), desc = $("#empty-desc");
      title.textContent = "没有结果";
      desc.textContent = (data.errors && data.errors.length)
        ? "引擎全部失败或被限流，原因见上方错误面板。可换关键词、减少类型筛选，或稍后重试。"
        : (state.kind === "onion"
            ? "暗网索引对中文关键词覆盖很差，试试英文关键词，或切回「全部」看目录入口。"
            : "换个关键词，或把类型切回「全部」。");
    }
    for (const r of rs){
      const el = document.createElement("article");
      el.className = "hit";
      const magnet = r.extra && r.extra.magnet;
      el.innerHTML = `
        <div class="hit-top">
          <span class="badge ${esc(r.kind)}">${esc(KIND_LABEL[r.kind] || r.kind)}</span>
          <a class="hit-title" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(r.title || r.url)}</a>
        </div>
        <div class="hit-url">${esc(r.url)}</div>
        ${r.snippet ? `<p class="hit-snip">${esc(r.snippet)}</p>` : ""}
        <div class="hit-foot">
          <span class="src">${esc((r.sources || []).join(" · "))}</span>
          <span>score ${Number(r.score || 0).toFixed(2)}</span>
          <button data-copy="${esc(magnet || r.url)}">${magnet ? "复制磁力" : "复制链接"}</button>
          <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer nofollow">打开 ↗</a>
        </div>`;
      hits.appendChild(el);
    }
    hits.querySelectorAll("button[data-copy]").forEach((b) =>
      b.addEventListener("click", () => copy(b.dataset.copy)));
  }

  function skeleton(n = 4){
    hits.innerHTML = Array.from({length:n}, () => '<div class="skeleton"></div>').join("");
    empty.style.display = "none";
    meta.innerHTML = "<span>搜索中…</span>";
    errBox.innerHTML = "";
  }

  async function run(query){
    if (!query.trim()) return;
    const params = new URLSearchParams({q: query.trim(), limit: "50", per_engine: "10"});
    if (state.kind) params.set("kinds", state.kind);
    if (patternsBox.checked) params.set("patterns", "1");
    if (controller) controller.abort();
    controller = new AbortController();
    skeleton();
    try{
      const res = await fetch("/api/search?" + params.toString(), {signal: controller.signal});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      render(data);
      const u = new URL(location.href);
      u.searchParams.set("q", query.trim());
      if (state.kind) u.searchParams.set("kind", state.kind); else u.searchParams.delete("kind");
      history.replaceState(null, "", u);
    } catch (e){
      if (e.name === "AbortError") return;
      hits.innerHTML = "";
      meta.innerHTML = "";
      errBox.innerHTML = `<div class="errors">请求失败：${esc(e.message)}</div>`;
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); run(input.value); });
  chips.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    state.kind = chip.dataset.kind;
    localStorage.setItem("omni.kind", state.kind);
    syncChips();
    const u = new URL(location.href);
    if (state.kind) u.searchParams.set("kind", state.kind); else u.searchParams.delete("kind");
    history.replaceState(null, "", u);
    if (state.data) run(input.value); else input.focus();
  });
  patternsBox.addEventListener("change", () => { if (state.data) run(input.value); });
  $("#btn-json").addEventListener("click", () => {
    if (!state.data) return showToast("先搜一次");
    const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `omnihunt-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("已导出");
  });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); input.focus(); input.select(); }
    if (e.key === "Escape" && document.activeElement === input) input.blur();
  });

  const EXAMPLES = ["demo tag", "index of archives", "urn:btih demo", "darknet index list"];
  $("#examples").innerHTML = EXAMPLES.map((x) =>
    `<button data-q="${esc(x)}">${esc(x)}</button>`).join("");
  $("#examples").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-q]"); if (!b) return;
    input.value = b.dataset.q; run(b.dataset.q);
  });

  fetch("/api/engines").then((r) => r.json()).then((d) => {
    pills.innerHTML = (d.engines || []).map((e) =>
      `<span class="pill ${e.enabled ? "" : "off"}" title="weight ${e.weight}">${esc(e.name)} · ${esc(e.kind)}</span>`).join("");
  }).catch(() => {});

  syncChips();
  const url = new URL(location.href);
  const kindParam = url.searchParams.get("kind");
  if (kindParam !== null && ["", "web", "onion", "adult", "torrent", "pattern"].includes(kindParam)){
    state.kind = kindParam;
    syncChips();
  }
  const initial = url.searchParams.get("q");
  if (initial){ input.value = initial; run(initial); }

  // PWA shell cache; only registered on secure contexts (localhost / https).
  if ("serviceWorker" in navigator &&
      (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))){
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
